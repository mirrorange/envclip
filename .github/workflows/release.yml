name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, zig: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-latest, zig: true }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
    runs-on: ${{ matrix.os }}
    env:
      # baked in as the default for `envclip push`; set it under Settings → Variables
      ENVCLIP_DEFAULT_SERVER: ${{ vars.ENVCLIP_SERVER }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: matrix.zig
        run: pip3 install --break-system-packages cargo-zigbuild
      - if: matrix.zig
        run: cargo zigbuild --release --locked --target ${{ matrix.target }}
      - if: ${{ !matrix.zig }}
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: package
        shell: bash
        run: |
          mkdir dist
          name=envclip-${{ matrix.target }}
          cp target/${{ matrix.target }}/release/envclip dist/$name
          cd dist
          if command -v sha256sum >/dev/null; then sha256sum $name > $name.sha256; else shasum -a 256 $name > $name.sha256; fi
          ls -l
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
