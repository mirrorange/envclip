name: deploy

# Deploys the Worker + D1 migrations. Requires the CLOUDFLARE_API_TOKEN and
# CLOUDFLARE_ACCOUNT_ID secrets, a real database_id in worker/wrangler.jsonc,
# and the repository variable DEPLOY_WORKER=true for automatic deploys.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["worker/**"]

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || vars.DEPLOY_WORKER == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npx wrangler d1 migrations apply envclip --remote
      - run: npx wrangler deploy
