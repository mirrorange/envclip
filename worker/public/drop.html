<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="robots" content="noindex">
  <title>envclip — sealed clip</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/style.css">
  <script type="module" src="/assets/drop.js"></script>
</head>
<body>
  <header class="bar">
    <a class="logo" href="/">envclip<span class="cursor">_</span></a>
    <nav>
      <a href="https://github.com/mirrorange/envclip" rel="noopener">github</a>
      <button class="link" id="lang" data-i18n="nav.lang">中文</button>
    </nav>
  </header>

  <main>
    <section class="hero">
      <h1 data-i18n="drop.title">This link is for an agent.</h1>
      <p data-i18n="drop.sub"></p>
    </section>

    <section class="panel">
      <div class="panel-head">
        <span class="prompt">$</span> <code id="d-id"></code>
        <span class="status" id="d-status"><i></i><span></span></span>
      </div>
      <pre class="term" id="d-cmd"></pre>
    </section>
  </main>

  <footer>
    <span>AES-256-GCM · HKDF-SHA256 · Cloudflare D1</span>
    <span data-i18n="foot.tag">zero-knowledge · burn after reading · no echo</span>
  </footer>
</body>
</html>
